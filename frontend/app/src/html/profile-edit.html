<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .edit-card {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .edit-header {
            background: white;
            padding: 25px 30px;
            border-bottom: 1px solid #f1f5f9;
        }

        .edit-title {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
        }

        .edit-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            color: #334155;
            transition: border-color 0.2s;
            box-sizing: border-box; /* 중요: 테두리 포함 크기 */
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6; /* 포커스 시 파란색 */
        }

        /* 수정 불가능한 필드 스타일 (Username 등) */
        .form-input:disabled {
            background-color: #f8fafc;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-save {
            flex: 2;
            padding: 15px;
            background-color: #10b981; /* 저장: 초록색 */
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background-color: #059669;
        }

        .btn-cancel {
            flex: 1;
            padding: 15px;
            background-color: #e2e8f0; /* 취소: 회색 */
            color: #475569;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: flex;       /* a 태그를 버튼처럼 */
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-cancel:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="edit-card">
        <div class="edit-header">
            <h1 class="edit-title">회원정보 수정 ✏️</h1>
        </div>

        <form class="edit-form" action="" method="POST">
            <div class="form-group">
                <label class="form-label">Username (ID)</label>
                <input type="text" class="form-input" value="DevCat_Master" disabled>
                <small style="color:#94a3b8; font-size:12px;">아이디는 변경할 수 없다냥.</small>
            </div>

            <div class="form-group">
                <label class="form-label">Codeforces Handle</label>
                <input type="text" name="handle" class="form-input" value="tourist_fan">
            </div>

            <div class="form-group">
                <label class="form-label">이름</label>
                <input type="text" name="real_name" class="form-input" value="김코딩">
            </div>

            <div class="form-group">
                <label class="form-label">학교</label>
                <input type="text" name="school" class="form-input" value="한국대학교">
            </div>

            <div class="form-group">
                <label class="form-label">전공</label>
                <input type="text" name="major" class="form-input" value="컴퓨터공학과">
            </div>

            <div class="form-group">
                <label class="form-label">학번</label>
                <input type="text" name="student_id" class="form-input" value="20241234">
            </div>

            <div class="btn-group">
                <a href="/profile" class="btn-cancel">취소</a>
                <button type="submit" class="btn-save">변경 사항 저장</button>
            </div>
        </form>
    </div>

</body>
</html>
