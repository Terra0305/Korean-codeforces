server {
    listen 80;
    server_name csforces.co.kr www.csforces.co.kr localhost;

    # Certbot challenge를 위한 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP로 접근 시 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name csforces.co.kr www.csforces.co.kr;

    # SSL 인증서 경로 (호스트의 ./certbot/conf를 컨테이너로 매핑)
    # -------------------------------------------------------------
    # 주의: 최초로 인증서를 발급받기 전에는 아래 4줄의 주석처리를 유지해야 합니다. (닭과 달걀 문제)
    # 인증서를 발급 받은 후에만 주석을 해제하고 Nginx를 재시작하세요.
    # -------------------------------------------------------------
    # ssl_certificate /etc/letsencrypt/live/csforces.co.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/csforces.co.kr/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
