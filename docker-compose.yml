services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,4.230.40.102,csforces.koreacentral.cloudapp.azure.com,csforces.co.kr,www.csforces.co.kr
      - CORS_ALLOWED_ORIGINS=https://csforces.co.kr,https://www.csforces.co.kr
      - CSRF_TRUSTED_ORIGINS=https://csforces.co.kr,https://www.csforces.co.kr
      - DEBUG=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/logs:/app/logs
      - ./backend/media:/app/media
  frontend:
    build: ./frontend/app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12시간마다 인증서 갱신(renew)을 확인하는 데몬을 띄워놓습니다.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    build: ./backend
    command: celery -A main worker -l info
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/media:/app/media
    environment:
      - DEBUG=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery_beat:
    build: ./backend
    command: celery -A main beat -l info
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/media:/app/media
    environment:
      - DEBUG=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis
